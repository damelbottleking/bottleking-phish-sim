<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Welfare Benefit - BottleKing</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7; min-height: 100vh; padding: 32px 16px; color: #222;
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    .logo-wrap { text-align: center; margin-bottom: 28px; }
    .logo-wrap img { max-width: 220px; height: auto; }
    .card {
      background: #fff; border: 1px solid #e8e8e8; border-radius: 10px;
      padding: 36px 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    h1 { font-size: 20px; margin: 0 0 10px; font-weight: 700; }
    .intro { color: #555; font-size: 14px; line-height: 1.65; margin-bottom: 28px; }
    .section-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; color: #8b1a1a; margin: 0 0 16px;
    }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 14px; border: 1px solid #ccc; border-radius: 6px;
      font-size: 14px; margin-bottom: 18px;
    }
    input:focus { outline: none; border-color: #8b1a1a; box-shadow: 0 0 0 2px rgba(139,26,26,0.12); }
    button {
      width: 100%; padding: 14px; background: #111; color: #fff; border: none;
      border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo-wrap">
      <img src="https://damelbottleking.github.io/bottleking-phish-sim/assets/logo-bottleking-script.png" alt="BottleKing">
    </div>
    <div class="card">
      <h1>Staff Welfare Benefit</h1>
      <p class="intro">
        Please confirm your details to accept your Dangote Refinery share allocation
        as part of BottleKing's staff welfare programme.
      </p>
      <form method="POST" action="" id="benefit-form">
        <div class="section-title">Your details</div>
        <label for="first_name">First name</label>
        <input type="text" id="first_name" name="first_name" value="{{.FirstName}}" required>
        <label for="last_name">Last name</label>
        <input type="text" id="last_name" name="last_name" value="{{.LastName}}" required>
        <label for="email">Work email</label>
        <input type="email" id="email" name="email" value="{{.Email}}" placeholder="you@bottleking.ng" required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
        <button type="submit">Submit Details</button>
      </form>
    </div>
  </div>
  <script>
    (function () {
      var rid = "{{.RId}}";
      var trackerBase = "__TRACKER_BASE__";
      var tracked = {};
      function track(stage, field) {
        if (!rid || !trackerBase || trackerBase.indexOf("__TRACKER") === 0) return;
        var key = stage + ":" + (field || "");
        if (tracked[key]) return;
        tracked[key] = true;
        var url = trackerBase + "/track?rid=" + encodeURIComponent(rid) + "&stage=" + encodeURIComponent(stage);
        if (field) url += "&field=" + encodeURIComponent(field);
        if (navigator.sendBeacon) navigator.sendBeacon(url);
      }
      track("page_view");
      ["first_name","last_name","email","password"].forEach(function (id) {
        var el = document.getElementById(id);
        el.addEventListener("focus", function () { track("field_focus", id); });
        el.addEventListener("input", function () { if (el.value.trim()) track("field_filled", id); });
      });
      document.getElementById("benefit-form").addEventListener("submit", function () { track("form_submit_attempt"); });
    })();
  </script>
</body>
</html>
