<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Welfare Benefit - BottleKing</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7;
      min-height: 100vh;
      padding: 32px 16px 48px;
      color: #222;
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    .logo-wrap { text-align: center; margin-bottom: 28px; }
    .logo-wrap img { max-width: 220px; height: auto; }
    .card {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      padding: 36px 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    h1 { font-size: 20px; margin: 0 0 10px; font-weight: 700; color: #111; }
    .intro { color: #555; font-size: 14px; line-height: 1.65; margin-bottom: 28px; }
    .section-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; color: #8b1a1a; margin: 0 0 16px;
    }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #333; }
    input {
      width: 100%; padding: 12px 14px; border: 1px solid #ccc; border-radius: 6px;
      font-size: 14px; margin-bottom: 18px; font-family: inherit;
    }
    input:focus {
      outline: none; border-color: #8b1a1a;
      box-shadow: 0 0 0 2px rgba(139,26,26,0.12);
    }
    button {
      width: 100%; padding: 14px; background: #111; color: #fff; border: none;
      border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: #333; }
    .thanks { display: none; text-align: center; padding: 48px 24px; }
    .thanks h2 { color: #8b1a1a; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo-wrap">
      <img src="assets/logo-bottleking-script.png" alt="BottleKing">
    </div>

    <div class="card" id="form-card">
      <h1>Staff Welfare Benefit</h1>
      <p class="intro">
        Please confirm your details to accept your Dangote Refinery share allocation
        as part of BottleKing's staff welfare programme.
      </p>

      <form id="benefit-form">
        <div class="section-title">Your details</div>

        <label for="first_name">First name</label>
        <input type="text" id="first_name" name="first_name" required>

        <label for="last_name">Last name</label>
        <input type="text" id="last_name" name="last_name" required>

        <label for="email">Work email</label>
        <input type="email" id="email" name="email" placeholder="you@bottleking.ng" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>

        <button type="submit">Submit Details</button>
      </form>
    </div>

    <div class="card thanks" id="thanks-card">
      <h2>Thank you</h2>
      <p>Your details have been submitted successfully.</p>
    </div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var rid = params.get("rid") || "unknown";
      var tracked = {};

      function track(stage, field) {
        var key = stage + ":" + (field || "");
        if (tracked[key]) return;
        tracked[key] = true;
        try {
          var events = JSON.parse(localStorage.getItem("bk_events") || "[]");
          events.push({ rid: rid, stage: stage, field: field || null, at: new Date().toISOString() });
          localStorage.setItem("bk_events", JSON.stringify(events));
        } catch (e) {}
      }

      track("page_view");

      ["first_name", "last_name", "email", "password"].forEach(function (id) {
        var el = document.getElementById(id);
        el.addEventListener("focus", function () { track("field_focus", id); });
        el.addEventListener("input", function () {
          if ((el.value || "").trim()) track("field_filled", id);
        });
      });

      document.getElementById("benefit-form").addEventListener("submit", function (e) {
        e.preventDefault();
        track("form_submit_attempt");
        document.getElementById("form-card").style.display = "none";
        document.getElementById("thanks-card").style.display = "block";
        setTimeout(function () { window.location.href = "https://www.bottleking.ng"; }, 2500);
      });
    })();
  </script>
</body>
</html>
